<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Weather App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="weather-card">
        <div class="search-box">
            <input type="text" id="city-input" placeholder="Enter city name..." autocomplete="off">
            <button id="search-btn">Search</button>
        </div>
        
        <div class="weather-info" id="weather-info">
            <h2 id="city-name">City Name</h2>
            <img id="weather-icon" src="" alt="Weather Icon" class="hidden">
            <p id="temperature" class="temp">--°C</p>
            <p id="description">Conditions</p>
            <div class="details">
                <p id="humidity">Humidity: --%</p>
                <p id="wind">Wind: -- m/s</p>
            </div>
        </div>

        <p id="error-msg" class="error hidden">City not found. Please try again.</p>
    </div>

    <script href="script.js"></script>
</body>
</html>

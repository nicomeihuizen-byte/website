<svg width="770" height="280" viewBox="0 0 770 280" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Birdbox field sensor station with model pipeline</title>
<desc>Diagram of a small weatherproof box on a wooden stake with a solar panel, Raspberry Pi, and antenna, wired to buried soil and weather gauges, feeding a three-stage model pipeline: LSTM forecaster, LLM planting scheduler, and anomaly/inventory model.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5b6472" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="770" height="280" fill="#f7f8f9"/>
<rect x="0" y="215" width="255" height="65" fill="#e7e2d8"/>
<line x1="0" y1="215" x2="255" y2="215" stroke="#c9c2b3" stroke-width="1"/>

<rect x="55" y="30" width="60" height="10" rx="2" fill="#2b3a4a" stroke="#0f1720" stroke-width="0.5"/>
<line x1="55" y1="35" x2="115" y2="35" stroke="#0f1720" stroke-width="0.5"/>
<line x1="72" y1="30" x2="72" y2="40" stroke="#0f1720" stroke-width="0.5"/>
<line x1="89" y1="30" x2="89" y2="40" stroke="#0f1720" stroke-width="0.5"/>
<line x1="106" y1="30" x2="106" y2="40" stroke="#0f1720" stroke-width="0.5"/>
<text x="120" y="38" font-family="Arial, sans-serif" font-size="11" fill="#5b6472">solar panel</text>

<rect x="35" y="40" width="100" height="8" rx="1" fill="#9aa2ad"/>
<rect x="50" y="48" width="70" height="52" rx="4" fill="#ffffff" stroke="#c7ccd3" stroke-width="1"/>
<text x="85" y="112" font-family="Arial, sans-serif" font-size="11" font-weight="500" text-anchor="middle" fill="#232830">weatherproof box</text>

<line x1="85" y1="48" x2="85" y2="22" stroke="#c7ccd3" stroke-width="1"/>
<circle cx="85" cy="20" r="2.5" fill="#5b6472"/>
<text x="93" y="16" font-family="Arial, sans-serif" font-size="11" fill="#5b6472">antenna</text>

<rect x="79" y="100" width="8" height="115" fill="#8a6a4a"/>
<rect x="74" y="145" width="18" height="6" fill="#8a6a4a"/>

<path d="M83 210 C 55 222 45 235 45 250" fill="none" stroke="#5b6472" stroke-width="1.5"/>
<path d="M79 210 C 100 225 108 238 108 250" fill="none" stroke="#5b6472" stroke-width="1.5"/>
<path d="M84 216 C 140 228 175 238 190 250" fill="none" stroke="#5b6472" stroke-width="1.5"/>

<rect x="30" y="250" width="50" height="24" rx="3" fill="#0f766e"/>
<text x="55" y="266" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#ffffff">soil moist.</text>

<rect x="90" y="253" width="50" height="24" rx="3" fill="#1d4ed8"/>
<text x="115" y="269" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#ffffff">soil temp</text>

<rect x="165" y="252" width="55" height="24" rx="3" fill="#b45309"/>
<text x="192" y="268" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#ffffff">nutrient/ph</text>

<line x1="220" y1="264" x2="270" y2="264" stroke="#5b6472" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="280" y="15" width="470" height="250" rx="6" fill="#ffffff" stroke="#c7ccd3" stroke-width="1"/>
<text x="515" y="36" font-family="Arial, sans-serif" font-size="13" font-weight="500" text-anchor="middle" fill="#232830">model pipeline</text>

<rect x="300" y="52" width="430" height="58" rx="4" fill="#f2ecfb" stroke="#c9b8f0" stroke-width="1"/>
<text x="515" y="76" font-family="Arial, sans-serif" font-size="12" font-weight="500" text-anchor="middle" fill="#5b21b6">LSTM forecaster</text>
<text x="515" y="94" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#6b7280">solar yield &amp; battery health prediction</text>

<line x1="515" y1="110" x2="515" y2="126" stroke="#5b6472" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="300" y="128" width="430" height="58" rx="4" fill="#e9f7ef" stroke="#a7e0be" stroke-width="1"/>
<text x="515" y="152" font-family="Arial, sans-serif" font-size="12" font-weight="500" text-anchor="middle" fill="#166534">LLM planting scheduler</text>
<text x="515" y="170" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#6b7280">biodynamic calendar + global soil/weather data</text>

<line x1="515" y1="186" x2="515" y2="202" stroke="#5b6472" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="300" y="204" width="430" height="52" rx="4" fill="#fdeeea" stroke="#f3b7a8" stroke-width="1"/>
<text x="515" y="226" font-family="Arial, sans-serif" font-size="12" font-weight="500" text-anchor="middle" fill="#9a3412">anomaly + inventory model</text>
<text x="515" y="244" font-family="Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#6b7280">compost/fertilizer timing, food stock forecasting</text>
</svg>
